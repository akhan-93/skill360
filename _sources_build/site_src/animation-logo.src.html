<!doctype html>
<html lang="fr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill360 — Animation du logo</title>
  <meta name="theme-color" content="#070B1F">
  <link rel="icon" href="assets/img/skill360-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
    .stage { position: relative; display: grid; place-items: center; overflow: hidden; isolation: isolate;
      background: radial-gradient(120% 90% at 50% 45%, #0E1640 0%, var(--nuit) 62%); padding: 40px var(--gutter); }
    .stage .hero__logo { width: min(90vw, 1100px); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 16px var(--gutter);
      border-top: 1px solid var(--ligne-sombre); background: #050817; font-size: 14px; color: var(--brume); }
    .bar input[type=range] { flex: 1 1 260px; accent-color: var(--halo); }
    .bar label { display: inline-flex; align-items: center; gap: 8px; }
    .bar .time { font-family: var(--font-display); font-size: 12px; color: var(--halo); min-width: 5.5ch; text-align: right; }
    .back { position: absolute; left: var(--gutter); top: 24px; z-index: 2; }
  </style>
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body>
<!-- @ICONS -->
<main class="stage">
  <a class="chip back" href="index.html">← Retour au site</a>
  <div class="hero__glow hero__glow--a" aria-hidden="true"></div>
  <div class="hero__logo">
    <!-- @HERO_LOGO -->
  </div>
</main>
<div class="bar" role="group" aria-label="Contrôles de l'animation">
  <button class="chip" type="button" id="play">Pause</button>
  <button class="chip" type="button" id="restart"><svg class="ico"><use href="#i-rejouer"/></svg> Rejouer</button>
  <label><input type="checkbox" id="loop" checked> Boucle</label>
  <label>Vitesse
    <select id="speed" class="chip"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option></select>
  </label>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position dans l'animation">
  <span class="time" id="time">0,00 s</span>
</div>
<script src="assets/js/vendor/gsap.min.js"></script>
<script src="assets/js/vendor/MorphSVGPlugin.min.js"></script>
<script src="assets/js/vendor/DrawSVGPlugin.min.js"></script>
<script src="assets/js/logo-intro.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin, DrawSVGPlugin);
  var svg = document.querySelector('.lg');
  Skill360.fitLogoStroke(svg);
  window.addEventListener('resize', function () { Skill360.fitLogoStroke(svg); });
  var tl = Skill360.createLogoIntro(svg, { repeat: -1, repeatDelay: 1.8 });
  window.__skill360Intro = tl;
  var play = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  var loop = document.getElementById('loop'), speed = document.getElementById('speed');
  var dragging = false;
  function label() { play.textContent = tl.paused() ? 'Lecture' : 'Pause'; }
  play.addEventListener('click', function () { tl.paused(!tl.paused()); label(); });
  document.getElementById('restart').addEventListener('click', function () { tl.restart(); label(); });
  loop.addEventListener('change', function () { tl.repeat(loop.checked ? -1 : 0); });
  speed.addEventListener('change', function () { tl.timeScale(+speed.value); });
  scrub.addEventListener('input', function () { dragging = true; tl.pause(); tl.progress(scrub.value / 1000); label(); });
  scrub.addEventListener('change', function () { dragging = false; });
  gsap.ticker.add(function () {
    if (!dragging) scrub.value = Math.round(tl.progress() * 1000);
    time.textContent = tl.time().toFixed(2).replace('.', ',') + ' s';
  });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { tl.pause(); label(); }
</script>
</body>
</html>
